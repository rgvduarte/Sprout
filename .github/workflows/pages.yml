name: Publicar no GitHub Pages

on:
  # Deploy automático suspenso durante a apresentação: o site fica congelado
  # na versão atual. Para publicar, correr o workflow manualmente.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publicar: ${{ steps.resultado.outputs.publicar }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Commits intermédios podem ainda não compilar. Nesse caso o deploy é
      # saltado sem marcar o run como falhado, e o site mantém a última versão boa.
      - name: Construir a webapp
        id: webapp
        if: hashFiles('webapp/package.json') != ''
        continue-on-error: true
        working-directory: webapp
        run: |
          npm ci || npm install
          npx vite build --base ./ --outDir ../_site --emptyOutDir

      - name: Página provisória (só enquanto não existe webapp)
        if: hashFiles('webapp/package.json') == ''
        run: |
          mkdir -p _site
          cp .github/pages/index.html _site/index.html

      - name: Decidir se publica
        id: resultado
        run: |
          if [ -f _site/index.html ] && [ "${{ steps.webapp.outcome }}" != "failure" ]; then
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          else
            echo "publicar=false" >> "$GITHUB_OUTPUT"
            echo "::notice::A webapp ainda não compila neste commit; mantém-se a versão publicada anterior."
          fi

      - name: Documentos (PDF e Excel)
        if: steps.resultado.outputs.publicar == 'true'
        run: |
          mkdir -p _site/documentos
          for f in docs/resumo/*.pdf docs/business-plan/*.pdf docs/business-plan/*.xlsx; do
            [ -f "$f" ] && cp "$f" _site/documentos/
          done
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
        if: steps.resultado.outputs.publicar == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.resultado.outputs.publicar == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
